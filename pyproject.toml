[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seedlink"
version = "0.1.0"
description = "Локальний desktop-звіт Seed Selector"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Jinja2==3.1.6",
    "openpyxl==3.1.5",
    "PySide6==6.11.2",
    "tzdata==2026.4",
    "XlsxWriter==3.2.9",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
build = ["PyInstaller==6.22.3"]

[project.scripts]
seedlink = "seedlink.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedlink = ["resources/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["seedlink"]
